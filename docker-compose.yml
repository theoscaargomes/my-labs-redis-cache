
services:
  redis:
    image: redis:7-alpine
    container_name: my-labs-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - labs-network

  app:
    build: .
    container_name: my-labs-app
    ports:
      - "8080:8080"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PRIMARY_FAIL_RATE: ${PRIMARY_FAIL_RATE:-0.3}
      SECONDARY_FAIL_RATE: ${SECONDARY_FAIL_RATE:-0.2}
      PRIMARY_DELAY_MS: ${PRIMARY_DELAY_MS:-100}
      SECONDARY_DELAY_MS: ${SECONDARY_DELAY_MS:-150}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - labs-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s

networks:
  labs-network:
    driver: bridge
